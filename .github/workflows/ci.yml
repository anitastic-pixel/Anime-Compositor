# Document 29, "CI gates". Four of the seven listed gates apply at this stage of the project:
# build on the primary supported platform, unit tests for model/time/math, render numeric
# fixture tests, and formatting/static analysis. Schema validation and persistence fixtures
# arrive with B-09, and the packaging smoke test with B-11. They are absent here because they
# have nothing to run yet, not because they were skipped.
#
# Windows only, per ADR-001. This is a Windows-only product and a green build on another
# platform would prove nothing about it.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; this step only reports what it resolved to, so a
      # failure caused by a toolchain change is visible in the log rather than mysterious.
      - name: Record toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      # The fixture table is the artifact the owner reviews, and it is regenerated by the test
      # run above. If the committed copy differs from what the code now produces, the PR is
      # showing the owner a result the build no longer supports.
      - name: Verification artifacts match the build
        run: git diff --exit-code -- verification/

      # The dependency record names a licence for every crate and the archive under Licenses/
      # is supposed to hold the text. tests/b11_dependency_record.rs checks that a directory
      # exists; this checks that what is in it is what the crate actually ships, which is the
      # half a hand-maintained archive gets wrong. It reads the same cargo metadata the build
      # resolved, so it cannot drift from it.
      - name: Archived licences match the crates
        run: python tools/archive_licenses.py --check

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
