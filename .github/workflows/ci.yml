# Document 29, "CI gates": build on the primary supported platform, unit tests for
# model/time/math, render numeric fixture tests, schema validation and persistence fixtures
# (B-09 on), the packaging and offline checks (B-11 on), and formatting/static analysis. The
# fixture, persistence and packaging checks are test programs, so the Test step runs them.
#
# The workspace has two crates as of the shell: the rendering core at the root and `app/`, the
# Tauri window. Every gate below is workspace-wide, because a gate that only sees one of them
# would go green on a broken window.
#
# Windows only, per ADR-001. This is a Windows-only product and a green build on another
# platform would prove nothing about it.

name: CI

# Work happens on main only (AGENTS.md), so pushes to main are what is checked.
on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; this step only reports what it resolved to, so a
      # failure caused by a toolchain change is visible in the log rather than mysterious.
      - name: Record toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --workspace --all-targets

      # GitHub's computer has no graphics card, and Windows' software card took over six hours
      # (run 38709950824). So this runs every test that never opens a card: both crates' own
      # tests and each file under tests/ that does not name `Gpu`. The card tests run on the
      # owner's machine, as they always have.
      - name: Test
        shell: pwsh
        # The failing tests are also written as one note on the run's page, which can be read
        # without signing in, unlike the log.
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --workspace --lib --bins --no-fail-fast 2>&1 | Tee-Object -Variable first
          if ($LASTEXITCODE) { $failed = 1 }
          $plain = Get-ChildItem tests -Filter *.rs |
            Where-Object { -not (Select-String -Path $_.FullName -Pattern '\bGpu\b|gpu::' -Quiet) } |
            ForEach-Object { '--test'; $_.BaseName }
          cargo test --no-fail-fast @plain 2>&1 | Tee-Object -Variable second
          if ($LASTEXITCODE) { $failed = 1 }
          $lines = @($first) + @($second) | ForEach-Object { "$_" }
          $bad = for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^test .+ FAILED$|^error: test failed') { $lines[$i] }
            elseif ($lines[$i] -match 'panicked at') { $lines[$i] + ' ' + $lines[$i + 1] }
          }
          # A failing table names its file; its rows that do not match go in the note too.
          $tables = @($bad | Select-String -Pattern 'see verification/(\S+\.md)' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { 'verification/' + $_.Groups[1].Value }) | Select-Object -Unique
          $bad = @($bad) + @($tables | Where-Object { Test-Path $_ } |
            ForEach-Object { Select-String -Path $_ -CaseSensitive -Pattern '\*\*NO\*\*' } |
            ForEach-Object { $_.Filename + ': ' + $_.Line }) | Where-Object { $_ }
          if ($bad) { '::error title=Failing tests::' + (($bad | Select-Object -Unique -First 200) -join '%0A') }
          if ($failed) { exit 1 }

      # The fixture table is the artifact the owner reviews, and it is regenerated by the test
      # run above. If the committed copy differs from what the code now produces, the PR is
      # showing the owner a result the build no longer supports.
      - name: Verification artifacts match the build
        run: git diff --exit-code -- verification/

      # The dependency record names a licence for every crate and the archive under Licenses/
      # is supposed to hold the text. tests/b11_dependency_record.rs checks that a directory
      # exists; this checks that what is in it is what the crate actually ships, which is the
      # half a hand-maintained archive gets wrong. It reads the same cargo metadata the build
      # resolved, so it cannot drift from it.
      - name: Archived licences match the crates
        run: python tools/archive_licenses.py --check

      # The record is generated, so the check that it is current is the same one used for every
      # other generated file here: regenerate it and require that nothing moved. Without this a
      # dependency change could land with the prose regenerated by hand and the table stale.
      - name: The dependency record is current
        run: |
          python tools/gen_dependencies.py
          git diff --exit-code -- docs/DEPENDENCIES.md

      # Two things drift silently in the prose: a document names a file that was renamed or
      # never existed, and a document quotes another artifact's score that has since changed.
      # Neither is visible to cargo, and the owner reads the prose rather than the code, so a
      # planning document that names a table which is not there is a defect in the thing being
      # delivered. It ran by hand until B-12d; a check nobody remembers to run is not a check.
      - name: The prose names files that exist and scores that agree
        run: python tools/audit_references.py

      # `cargo fmt --all --check` passes every file to one rustfmt command, and with this many
      # test programs that command is longer than Windows allows (os error 206). The same check,
      # one file list from git: every tracked .rs file outside the quarantined spikes/ and the
      # proposal sketches kept under verification/.
      - name: Formatting
        shell: bash
        run: git ls-files '*.rs' ':!spikes' ':!verification' | xargs rustfmt --check --edition 2021

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
