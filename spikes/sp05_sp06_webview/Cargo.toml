[package]
name = "sp05_sp06_webview"
version = "0.0.0"
edition = "2021"
publish = false
description = "G0 spike SP-05 (frame transport into WebView2) and SP-06 (viewer colour exactness). Quarantined per document 06; not production code."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
rayon = "1"

[profile.release]
opt-level = 3
