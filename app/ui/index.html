<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anime Compositor</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #141416; color: #d8d8dc;
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  /* `minmax(0, 1fr)` and not `1fr`: a grid track sizes itself to its item first, so the canvas
     would make the row taller than the stage and then be cut off by the bar at large text sizes
     rather than shrinking to fit. */
  #stage {
    flex: 1; display: grid; place-items: center; min-height: 0; padding: 12px;
    grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
  }
  /* Checkerboard, so a transparent frame reads as transparent rather than as black. */
  canvas {
    max-width: 100%; max-height: 100%; image-rendering: pixelated;
    background-color: #2a2a2e;
    background-image:
      linear-gradient(45deg, #333338 25%, transparent 25%, transparent 75%, #333338 75%),
      linear-gradient(45deg, #333338 25%, transparent 25%, transparent 75%, #333338 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px;
  }
  /* Q-03, display scaling: at a large text size in a small window the bar wraps onto many lines,
     and a bar allowed to grow without limit takes the whole window and the picture disappears.
     It keeps at most half and scrolls the rest, so the thing being composited is always on
     screen. */
  #bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; border-top: 1px solid #26262b; background: #1a1a1d;
    max-height: 50vh; overflow-y: auto;
  }
  button {
    font: inherit; color: inherit; background: #26262b;
    border: 1px solid #35353c; border-radius: 4px; padding: 3px 10px; cursor: pointer;
  }
  button:hover { background: #303038; }
  /* Q-03: every control must be reachable by keyboard and it must be obvious which one has the
     keyboard. The ring is its own colour — orange already means a warning here and green already
     means a save happened, so a third meaning would have to borrow one of those. */
  button:focus-visible, select:focus-visible {
    outline: 2px solid #7aa7ff; outline-offset: 2px;
  }
  #quality { font-weight: 600; }
  /* D-33 / R-06a: the indication that preview differs from export is never subtle and never
     absent. It is coloured only when it differs; a full-resolution preview is the quiet case. */
  #quality.differs { color: #e8866a; }
  #frame { font-variant-numeric: tabular-nums; }
  #report { color: #8b8b94; flex: 1; min-width: 100%; }
  #report.dropped { color: #e8b06a; }
  .hint { color: #6a6a72; }
  #project { font-weight: 600; }
  /* Document 26: unsaved work is visible, always, and never inferred by the page — the core
     answers whether the document is dirty and this only draws the answer. */
  #dirty { color: #e8b06a; font-weight: 600; }
  #dirty:empty { display: none; }
  #status { color: #7fb37f; }
  #status:empty { display: none; }
  /* An autosave is not something the person asked for, so it is said quietly and beside the
     status line rather than in it. */
  #autosaved { color: #6a6a72; }
  #autosaved:empty { display: none; }
  select {
    font: inherit; color: inherit; background: #26262b;
    border: 1px solid #35353c; border-radius: 4px; padding: 3px 6px; max-width: 260px;
  }
  /* Document 28's warnings, one line each, in the words the core used. They are never folded
     away behind a count: a project that opened with something wrong with it says so for as
     long as it is open. */
  #notes {
    min-width: 100%; margin: 0; padding: 0; list-style: none;
    color: #e8b06a; white-space: pre-wrap;
  }
  #notes:empty { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="view" width="480" height="270"></canvas></div>
<div id="bar">
  <button id="play">Play</button>
  <button id="back">&#8592;</button>
  <button id="fwd">&#8594;</button>
  <span id="frame">frame &mdash;</span>
  <span id="quality">&mdash;</span>
  <button id="toggle">Full resolution</button>
  <span id="project">&mdash;</span><span id="dirty"></span>
  <button id="open">Open&hellip;</button>
  <button id="save">Save</button>
  <button id="saveas">Save As&hellip;</button>
  <select id="recent"><option value="">Recent&hellip;</option></select>
  <select id="recovery" hidden><option value="">Recover unsaved work&hellip;</option></select>
  <span class="hint">space, arrows, D &middot; Ctrl+O, Ctrl+S, Ctrl+Shift+S &middot; or drop a project file here</span>
  <span id="status"></span>
  <span id="autosaved"></span>
  <span id="report"></span>
  <ul id="notes"></ul>
</div>
<script>
// Any error at all goes on screen. A viewer that fails silently is worse than one that fails.
addEventListener('error', (e) => {
  const r = document.getElementById('report');
  r.textContent = 'script error: ' + e.message;
  r.className = 'dropped';
});
// The frame transport, D-36: a custom URI scheme, not IPC. On Windows a custom scheme is served
// over http with the scheme's name as a subdomain of localhost, which is why these two read the
// way they do rather than as a scheme of their own. Both addresses are on this machine, and
// `tests/b11_offline_record.rs` requires that every address written in this file is.
const FRAMES = 'http://frame.localhost';
// The command transport, beside the frame one: open, save, save as, recent. A command is a
// request with an answer, and its answer is the sentence the status line shows.
const PROJECT = 'http://project.localhost';

const view = document.getElementById('view');
const paint = view.getContext('2d');

let playing = false;
let started = 0;      // performance.now() at the instant playback began
let quality = 'draft';
let frame = 0;
let inFlight = false;

// A request already on its way is never joined by a second one. That is the whole of this
// page's part in D-32: the clock keeps running while a frame is being made, so the next answer
// is a later frame and the ones in between are counted as skipped by Playback::at in Rust.
// Nothing here decides which frame to show, and nothing here counts a skip.
async function show(url) {
  if (inFlight) return;
  inFlight = true;
  try {
    const response = await fetch(url);
    if (!response.ok) {
      document.getElementById('report').textContent = await response.text();
      document.getElementById('report').className = 'dropped';
      playing = false;
      document.getElementById('play').textContent = 'Play';
      return;
    }
    const h = response.headers;
    const width = +h.get('x-width'), height = +h.get('x-height');
    const pixels = new Uint8ClampedArray(await response.arrayBuffer());
    if (view.width !== width || view.height !== height) {
      view.width = width; view.height = height;
    }
    paint.putImageData(new ImageData(pixels, width, height), 0, 0);

    frame = +h.get('x-frame');
    document.getElementById('frame').textContent = 'frame ' + frame;

    // The indicator describes the render that just arrived, because it came back with it.
    const differs = h.get('x-differs') === 'true';
    const label = document.getElementById('quality');
    label.textContent = h.get('x-quality') + ' — ' + width + '×' + height
      + (differs ? ', not final pixels' : ', same as export');
    label.className = differs ? 'differs' : '';
    document.getElementById('toggle').textContent =
      differs ? 'Full resolution' : 'Draft resolution';
    quality = differs ? 'draft' : 'full';

    const report = document.getElementById('report');
    report.textContent = h.get('x-report') || '';
    report.className = +h.get('x-skipped') > 0 ? 'dropped' : '';

    // Which project these pixels came from, and what the core said when it opened it. Both
    // travel percent-encoded, because a project named in Japanese cannot ride a header raw.
    document.getElementById('project').textContent =
      decodeURIComponent(h.get('x-project') || '');
    // Document 26's dirty state, as the core answers it. A dot, because it has to be visible
    // without being read.
    document.getElementById('dirty').textContent =
      h.get('x-dirty') === 'true' ? ' • unsaved' : '';
    document.getElementById('status').textContent =
      decodeURIComponent(h.get('x-status') || '');
    document.getElementById('autosaved').textContent =
      decodeURIComponent(h.get('x-autosaved') || '');
    // The snapshots there are to recover, rebuilt from the frame that just arrived because the
    // timer adds one every two minutes and the list must not go stale while somebody works.
    const recovery = document.getElementById('recovery');
    const paths = decodeURIComponent(h.get('x-recovery') || '').split('\n').filter(Boolean);
    recovery.hidden = paths.length === 0;
    if (recovery.dataset.paths !== paths.join('\n')) {
      recovery.dataset.paths = paths.join('\n');
      recovery.replaceChildren(new Option('Recover unsaved work…', ''), ...paths.map(
        (path) => new Option(path, path)));
    }
    const notes = decodeURIComponent(h.get('x-notes') || '');
    const list = document.getElementById('notes');
    list.replaceChildren(...(notes ? notes.split('\n') : []).map((line) => {
      const item = document.createElement('li');
      item.textContent = line;
      return item;
    }));
  } catch (e) {
    document.getElementById('report').textContent = 'the frame did not arrive: ' + e;
    document.getElementById('report').className = 'dropped';
    playing = false;
    document.getElementById('play').textContent = 'Play';
  } finally {
    inFlight = false;
  }
}

function tick() {
  if (playing) show(FRAMES + '/at/' + Math.round(performance.now() - started) + '?q=' + quality);
  requestAnimationFrame(tick);
}

function step(by) {
  playing = false;
  document.getElementById('play').textContent = 'Play';
  show(FRAMES + '/frame/' + (frame + by) + '?q=' + quality);
}

document.getElementById('play').onclick = () => {
  playing = !playing;
  if (playing) started = performance.now();
  document.getElementById('play').textContent = playing ? 'Pause' : 'Play';
};
document.getElementById('back').onclick = () => step(-1);
document.getElementById('fwd').onclick = () => step(1);
document.getElementById('toggle').onclick = () => {
  quality = quality === 'draft' ? 'full' : 'draft';
  show(FRAMES + '/frame/' + frame + '?q=' + quality);
};

// A command, and then the current frame again so that everything the window says about the
// project — its name, its warnings, whether it has unsaved work — comes back from the same
// place it always does. A command that opens a dialog answers immediately and says nothing;
// what it eventually does reaches the page as a reload, from Rust.
async function command(what) {
  try {
    const said = await (await fetch(PROJECT + what)).text();
    if (said) document.getElementById('status').textContent = said;
  } catch (e) {
    document.getElementById('report').textContent = 'the command did not arrive: ' + e;
    document.getElementById('report').className = 'dropped';
    return;
  }
  show(FRAMES + '/frame/' + frame + '?q=' + quality);
}

document.getElementById('open').onclick = () => command('/open');
document.getElementById('save').onclick = () => command('/save');
document.getElementById('saveas').onclick = () => command('/save-as');
document.getElementById('recent').onchange = (e) => {
  const chosen = e.target.value;
  e.target.selectedIndex = 0;
  if (chosen) command('/open?path=' + encodeURIComponent(chosen));
};
document.getElementById('recovery').onchange = (e) => {
  const chosen = e.target.value;
  e.target.selectedIndex = 0;
  if (chosen) command('/recover?path=' + encodeURIComponent(chosen));
};

// The list is rebuilt on every load, which is also every open and every save-as, because those
// reload the page. Full paths, because two shots in two directories are often both "shot.json".
async function fillRecent() {
  const list = document.getElementById('recent');
  try {
    const text = await (await fetch(PROJECT + '/recent')).text();
    for (const path of text.split('\n').filter(Boolean)) {
      const option = document.createElement('option');
      option.value = path;
      option.textContent = path;
      list.append(option);
    }
  } catch (e) { /* no list is a missing convenience, not a broken viewer */ }
}

addEventListener('keydown', (e) => {
  // Q-03: a control that has the keyboard keeps it. Space on the focused Save button has to save,
  // not start playback, and an arrow on the recent list has to move through the list. The
  // accelerators below are for when nothing in particular is focused; Ctrl combinations are not,
  // because those mean the same thing everywhere and no button answers them.
  const onAControl = e.target instanceof Element && e.target.closest('button, select');
  if (onAControl && !e.ctrlKey) return;
  if (e.ctrlKey && (e.key === 'o' || e.key === 'O')) { e.preventDefault(); command('/open'); }
  else if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
    e.preventDefault();
    command(e.shiftKey ? '/save-as' : '/save');
  }
  else if (e.ctrlKey) { /* leave every other accelerator alone */ }
  else if (e.key === ' ') { e.preventDefault(); document.getElementById('play').click(); }
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'd' || e.key === 'D') document.getElementById('toggle').click();
});

// D-35: at rest the viewer shows the work area's first frame.
show(FRAMES + '/frame/0?q=draft');
fillRecent();
requestAnimationFrame(tick);
</script>
</body>
</html>
