<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redesign drawings</title>
<!-- The redesign's drawings, W-31 to W-37, in D-176's order, each with a picture and a link.
     The pictures are the ones in verification/, taken by headless Edge from these files. -->
<style>
  :root {
    color-scheme: dark;
    --bg: #101010; --panel: #1e1e1e; --strip: #2b2b2b; --text: #d0d0d4; --dim: #909096;
    --accent: #e8b06a; --blue: #6ea8fe; --ok: #6cc28a;
  }
  html { font-size: 13px; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 1rem/1.45 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; color: #fff; }
  .cap { color: var(--dim); margin: 0 0 16px; max-width: 60rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: 14px; }
  a.card { display: flex; flex-direction: column; background: var(--panel); border: 1px solid #2c2c2c; border-radius: 6px; overflow: hidden; color: inherit; text-decoration: none; }
  a.card:hover, a.card:focus-visible { border-color: var(--blue); outline: none; }
  .thumb { height: 11rem; background: #0b0b0b left top / cover no-repeat; border-bottom: 1px solid #2c2c2c; }
  .txt { padding: 8px 10px 10px; }
  .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .id { white-space: nowrap; color: var(--dim); font-variant-numeric: tabular-nums; }
  .nm { color: #fff; font-weight: 600; white-space: nowrap; }
  .st { margin-left: auto; font-size: 0.8rem; border-radius: 8px; padding: 0 7px; white-space: nowrap; }
  .st.yes { color: #cdeed8; background: #244232; }
  .st.draft { color: #ffe3bd; background: #4a3719; }
  .txt p { margin: 4px 0 0; color: var(--dim); }
</style>
</head>
<body>
<h1>The redesign, screen by screen</h1>
<p class="cap">Drawings of each part of the window, in the order they will be built (D-176). None of them is the program: open one to see its states. Nothing in them adds, removes or re-keys a command.</p>
<div class="grid" id="grid"></div>
<script>
const P = '../verification/';
const SCREENS = [
  ['W-31', 'Timeline', 'W-31_timeline.html', 'W-31 pictures/normal.png', 'yes', 'Accepted 2026-09-28 (D-176)', 'One header row, a New layer menu, timing badges, missing drawings in red.'],
  ['W-32', 'Sheet and exposure list', 'W-32_sheet.html', 'W-32 pictures/sheet.png', 'draft', 'Proposed draft', 'The Sheet as its own panel, and the exposure list rebuilt inside it (D-64).'],
  ['W-33', 'Viewer', 'W-33_viewer.html', 'W-33 pictures/normal.png', 'draft', 'Proposed draft', 'Draft or full resolution said on the picture; the controls in four groups.'],
  ['W-34', 'Effect controls', 'W-34_effect_controls.html', 'W-34 pictures/layer.png', 'draft', 'Proposed draft', 'Folding sections, key diamonds, effect cards with one menu each.'],
  ['W-35', 'Project and Effects', 'W-35_project_effects.html', 'W-35 pictures/project.png', 'draft', 'Proposed draft', 'Compositions and drawings with their facts; the effect list with what each does.'],
  ['W-36', 'Strips and states', 'W-36_strips_and_states.html', 'W-36 pictures/normal.png', 'draft', 'Proposed draft', 'One-row top strip, one-line bottom strip, empty, unsaved, export and recovery.'],
  ['W-37', 'Shortcuts', 'W-37_shortcuts.html', 'W-37 pictures/list.png', 'draft', 'Proposed draft', 'A searchable list of every shortcut, and changing one with a clash warning.'],
];
document.getElementById('grid').innerHTML = SCREENS.map(([id, name, file, pic, st, words, about]) =>
  '<a class="card" href="' + file + '"><div class="thumb" style="background-image:url(\'' + P + encodeURI(pic) + '\')"></div>'
  + '<div class="txt"><div class="top"><span class="id">' + id + '</span><span class="nm">' + name + '</span><span class="st ' + st + '">' + words + '</span></div><p>' + about + '</p></div></a>').join('');
</script>
</body>
</html>
