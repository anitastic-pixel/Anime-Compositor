[package]
name = "anime_compositor"
version = "0.1.0"
edition = "2021"
# D-31, decided by the owner on 2026-09-05: dual MIT or Apache-2.0, the convention almost
# every crate in this build already follows. ADR-010 made the project open source; this is
# the line that makes the repository say so.
license = "MIT OR Apache-2.0"
publish = false
description = "Cel exposure and finishing compositor. G1-core: colour, alpha and compositing."

# The G0 spikes are quarantined per document 06 and are not production code. They keep
# their own manifests and are deliberately excluded from this workspace so that nothing
# under src/ can depend on them.
[workspace]
members = ["app"]
exclude = ["spikes"]

# Document 29's Lints gate is `cargo clippy -- -D warnings`. These clippy lints are switched
# off for the whole workspace because what they ask for is either a different answer or a style
# this code chose on purpose; every other lint still fails the gate.
[workspace.lints.clippy]
# Different answers when a number is NaN, so the rewrite would change pixels: `!(a < b)` is
# not `a >= b`, `!(w > 0 && p)` is not `w <= 0 || !p`, and `x.max(0).min(1)` gives 0 for NaN
# where `clamp` gives NaN. The NaN-aware forms are deliberate.
neg_cmp_op_on_partial_ord = "allow"
nonminimal_bool = "allow"
manual_clamp = "allow"
# Pixel loops index several buffers by the same x and y; an iterator over one of them reads
# worse and is not quicker.
needless_range_loop = "allow"
# Effects take their settings as plain arguments and return plain tuples, so the signatures
# are long; a struct for each would be one more name for the same list.
too_many_arguments = "allow"
type_complexity = "allow"
# `from_str` returns an Option here (an unknown word is a diagnostic, not an error type), so
# std's FromStr does not fit; and the effect and card enums are moved, not stored in bulk.
should_implement_trait = "allow"
large_enum_variant = "allow"

[lints]
workspace = true

# Audit S6: line numbers only, which still names file and line in errors, at a fraction of
# the disk each test program takes.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3

[dependencies]
png = "0.18.1"
rayon = "1.12.0"
# D-62, accepted on 2026-09-17: OpenEXR in and out. Default features off, which drops the
# crate's own thread pool; it reads every compression in `Fixtures/exr` and writes ZIP.
exr = { version = "1.74.2", default-features = false }
# B-09 reads and writes the project document as JSON values rather than through derive
# macros, deliberately: ADR-008 requires unknown additive data to survive a load and save,
# and a derived struct drops what it has no field for. Only `serde_json` is used.
serde_json = "1.0.151"
image = { version = "0.25.10", default-features = false, features = ["bmp", "tga", "tiff", "webp", "jpeg"] }
gif = "0.14.2"
# B-44, D-100 (a): the viewer's picture drawn on the graphics card, through Direct3D 12 or
# Vulkan. Exports and fixtures never touch it. `pollster` waits for the card's answers and
# `bytemuck` hands it f32 pixels as bytes; bytemuck was already in the tree.
wgpu = { version = "26.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan"] }
pollster = "0.4.0"
bytemuck = "1.25.2"
# B-44b: drawings go to the card as sixteen-bit floats, half the bytes of the CPU's. Already in
# the tree under `exr`; `bytemuck` lets its numbers be written straight into the card's buffer.
half = { version = "2.7.1", features = ["bytemuck"] }
# D-263: text layers. Reads a font's outlines, which `src/text.rs` fills itself; default features
# off (`rustybuzz` below turns on what shaping needs).
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout"] }
# D-354, D-371: shapes the words (joining scripts, conjuncts, marks, ligatures). 0.20.1 is the
# release built on ttf-parser 0.25, so the two share one copy.
rustybuzz = "0.20.1"
# D-638 1 (a), D-639: FLAC, MP3 and Ogg Vorbis sound read in the core. Default features off;
# only those formats' features on (AAC goes through Windows' own decoder, Opus is not read).
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "ogg", "vorbis"] }

# D-72 and D-30: MP4 goes out through the encoder Windows carries. Already in the tree under Tauri.
[target.'cfg(windows)'.dependencies]
# B-44b: `Win32_Graphics_Dxgi` asks Windows how much memory the graphics card has.
# B-45: `Win32_UI_WindowsAndMessaging` lets the card paint under the page (`Gpu::attach`).
# B-48: `Win32_System_SystemInformation` asks Windows how much memory the machine has.
# B-780: `Win32_System_Threading` puts the threads that make frames ahead below normal priority.
windows = { version = "0.61.3", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Graphics_Dxgi", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
# `tests/b11_dependency_record.rs` asks cargo what the build resolves and reads the answer.
# Already in the graph above; this adds no crate, only visibility from the test binaries.
serde_json = "1.0.151"
